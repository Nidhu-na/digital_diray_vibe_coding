<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle — Modern Digital Diary & Mood Tracker</title>
  <meta name="description" content="A modern, sleek, and private digital diary app for mindful journaling, mood tracking, writing insights, and daily memories.">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6366f1">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap');
    :root {
      --bg-primary: #0b0f19; --bg-secondary: #111827; --surface: rgba(17, 24, 39, 0.75); --surface-solid: #1e293b;
      --surface-hover: #1e293b; --surface-border: rgba(255, 255, 255, 0.08); --text-primary: #f8fafc; --text-secondary: #94a3b8;
      --text-muted: #64748b; --accent-primary: #818cf8; --accent-primary-hover: #6366f1; --accent-light: rgba(99, 102, 241, 0.2);
      --accent-glow: rgba(129, 140, 248, 0.25); --radius-xs: 6px; --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px; --radius-full: 9999px;
      --sidebar-width: 280px; --header-height: 72px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
    #app-root { display: flex; min-height: 100vh; }
    .sidebar { width: var(--sidebar-width); background: var(--bg-secondary); border-right: 1px solid var(--surface-border); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; }
    .main-wrapper { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { height: var(--header-height); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--surface-border); background: var(--surface); backdrop-filter: blur(12px); sticky: top 0; z-index: 50; }
    .content-body { padding: 32px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
    .btn-primary-gradient { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #ffffff; border: none; padding: 12px 20px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; width: 100%; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .btn-primary-gradient:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35); }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-sm); color: var(--text-secondary); background: transparent; border: none; font-weight: 600; width: 100%; text-align: left; cursor: pointer; margin-bottom: 4px; transition: all 0.2s ease; }
    .nav-item:hover, .nav-item.active { background: var(--surface-solid); color: var(--accent-primary); }
    .entries-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 24px; }
    .entry-card { background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 24px; transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; position: relative; overflow: hidden; }
    .entry-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.2); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-container { background: var(--bg-secondary); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 32px; }
    .header-search { display: flex; align-items: center; gap: 10px; background: var(--bg-secondary); padding: 8px 16px; border-radius: var(--radius-full); border: 1px solid var(--surface-border); width: 320px; }
    .header-search input { background: transparent; border: none; color: var(--text-primary); width: 100%; outline: none; }
    .security-lock-screen { position: fixed; inset: 0; background: var(--bg-primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .lock-card { text-align: center; background: var(--bg-secondary); border: 1px solid var(--surface-border); padding: 40px; border-radius: var(--radius-lg); width: 100%; max-width: 360px; }
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
    .keypad-btn { padding: 16px; font-size: 1.2rem; font-weight: 700; border-radius: var(--radius-md); background: var(--surface-solid); border: 1px solid var(--surface-border); color: var(--text-primary); cursor: pointer; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-wrapper { margin-left: 0; } }
  </style>
</head>
<body>
  <div id="app-root">
    <aside class="sidebar">
      <div>
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
          <div style="width:40px; height:40px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff;">📖</div>
          <div><h1 style="font-size:1.2rem; font-weight:800;">Chronicle</h1><p style="font-size:0.75rem; color:var(--text-muted);">Digital Diary</p></div>
        </div>
        <button id="new-entry-btn" class="btn-primary-gradient" style="margin-bottom: 24px;">+ New Entry</button>
        <nav>
          <button class="nav-item active" data-view="timeline">📰 Journal Feed</button>
          <button class="nav-item" data-view="calendar">📅 Calendar View</button>
          <button class="nav-item" data-view="analytics">📊 Mood Insights</button>
        </nav>
      </div>
      <div>
        <button id="lock-app-btn" class="nav-item">🔒 Lock App</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="app-header">
        <div class="header-search">
          <input type="text" id="global-search-input" placeholder="Search memories..." />
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <select id="header-theme-select" style="padding:6px 12px; border-radius:20px; background:var(--surface-solid); color:var(--text-primary); border:1px solid var(--surface-border);">
            <option value="dark">🌙 Dark Sleek</option>
            <option value="light">☀️ Light Minimal</option>
            <option value="parchment">📜 Parchment</option>
          </select>
          <button id="settings-btn" style="background:none; border:none; color:var(--text-primary); font-size:1.2rem; cursor:pointer;">⚙️</button>
        </div>
      </header>

      <main class="content-body">
        <div id="timeline-view">
          <h2 style="font-size:1.6rem; font-weight:800;">Your Memories & Reflections</h2>
          <p style="color:var(--text-muted); margin-bottom:24px;">Capture thoughts and reflect on life.</p>
          <div id="entries-container" class="entries-grid"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
    (function() {
      'use strict';
      const MOODS = [
        { id: 'ecstatic', label: 'Ecstatic', emoji: '🤩', color: '#f59e0b' },
        { id: 'happy', label: 'Happy', emoji: '😊', color: '#10b981' },
        { id: 'calm', label: 'Calm', emoji: '😌', color: '#06b6d4' },
        { id: 'inspired', label: 'Inspired', emoji: '✨', color: '#8b5cf6' },
        { id: 'thoughtful', label: 'Thoughtful', emoji: '🤔', color: '#3b82f6' }
      ];
      let entries = JSON.parse(localStorage.getItem('chronicle_entries') || '[]');
      if (!entries.length) {
        entries = [
          { id: '1', title: 'A Morning Reflection', date: new Date().toISOString(), mood: 'calm', content: 'Enjoyed a quiet morning coffee while reflecting on new goals.', tags: ['Mindfulness'] },
          { id: '2', title: 'Project Breakthrough', date: new Date().toISOString(), mood: 'ecstatic', content: 'Completed building and deploying the digital diary web app!', tags: ['Coding', 'Milestone'] }
        ];
        localStorage.setItem('chronicle_entries', JSON.stringify(entries));
      }
      function renderEntries() {
        const container = document.getElementById('entries-container');
        if (!container) return;
        container.innerHTML = entries.map(e => `
          <div class="entry-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <span style="font-weight:700; color:${MOODS.find(m=>m.id===e.mood)?.color || '#8b5cf6'}">${MOODS.find(m=>m.id===e.mood)?.emoji || '📝'} ${e.mood}</span>
              <span style="font-size:0.75rem; color:var(--text-muted);">${new Date(e.date).toLocaleDateString()}</span>
            </div>
            <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:8px;">${e.title}</h3>
            <p style="font-size:0.9rem; color:var(--text-secondary); line-height:1.5;">${e.content}</p>
          </div>
        `).join('');
      }
      document.addEventListener('DOMContentLoaded', () => {
        renderEntries();
        if (window.lucide) window.lucide.createIcons();
      });
    })();
  </script>
</body>
</html>
